20,ja:"宿題を忘れてしまいました。",yomi:"しゅくだいを わすれてしまいました。",zh:"不小心忘了功課。",grammar:"てしまう",group:2},{id:21,ja:"窓が開けてあります。",yomi:"まどが あけてあります。",zh:"窗戶是開著的(有人故意開的)。",grammar:"てある",group:2},{id:22,ja:"窓が開いています。",yomi:"まどが あいています。",zh:"窗戶開著。",grammar:"ている",group:2},{id:23,ja:"財布が落ちていました。",yomi:"さいふが おちていました。",zh:"錢包掉了在地上。",grammar:"ていた",group:2},{id:24,ja:"週末、映画を見ようと思っています。",yomi:"しゅうまつ、えいがを みようと おもっています。",zh:"打算週末看電影。",grammar:"ようと思う",group:2},{id:25,ja:"明日、雨が降るでしょう。",yomi:"あした、あめが ふるでしょう。",zh:"明天大概會下雨吧。",grammar:"でしょう",group:2},{id:26,ja:"夏休みに旅行するつもりです。",yomi:"なつやすみに りょこうする つもりです。",zh:"打算暑假去旅行。",grammar:"つもり",group:2},{id:27,ja:"来月、引っ越す予定です。",yomi:"らいげつ、ひっこす よていです。",zh:"預定下個月搬家。",grammar:"予定",group:2},{id:28,ja:"明日は雨が降るそうです。",yomi:"あしたは あめが ふるそうです。",zh:"聽說明天會下雨。",grammar:"伝聞そうだ",group:2},{id:29,ja:"このケーキは美味しそうです。",yomi:"このけーきは おいしそうです。",zh:"這個蛋糕看起來很好吃。",grammar:"様態そうだ",group:2},{id:30,ja:"あの人は学生のようです。",yomi:"あのひとは がくせいの ようです。",zh:"那個人好像是學生。",grammar:"ようだ",group:2},{id:31,ja:"彼は来ないみたいです。",yomi:"かれは こないみたいです。",zh:"他好像不會來。",grammar:"みたい",group:2},{id:32,ja:"日本へ行ったことがありますか。",yomi:"にほんへ いったことが ありますか。",zh:"有去過日本嗎？",grammar:"たことがある",group:2},{id:33,ja:"まだ宿題をしていません。",yomi:"まだ しゅくだいを していません。",zh:"還沒做功課。",grammar:"まだ〜ていない",group:2},{id:34,ja:"もう昼ご飯を食べました。",yomi:"もう ひるごはんを たべました。",zh:"已經吃過午餐了。",grammar:"もう",group:2},{id:35,ja:"難しくて、できません。",yomi:"むずかしくて、できません。",zh:"很難所以做不到。",grammar:"て",group:2},{id:36,ja:"辞書を使いながら、勉強します。",yomi:"じしょを つかいながら、べんきょうします。",zh:"一邊用字典一邊學習。",grammar:"ながら",group:2},{id:37,ja:"子供でも、この本が読めます。",yomi:"こどもでも、このほんが よめます。",zh:"即使是小孩也能讀這本書。",grammar:"でも",group:2},{id:38,ja:"電車に乗り遅れたので、会社に遅れました。",yomi:"でんしゃに のりおくれたので、かいしゃに おくれました。",zh:"因為沒趕上電車所以上班遲到了。",grammar:"ので",group:2},{id:39,ja:"この時計は父に買ってもらいました。",yomi:"このとけいは ちちに かってもらいました。",zh:"這個錶是爸爸買給我的。",grammar:"買ってもらう",group:2},{id:40,ja:"部屋を掃除してもらえませんか。",yomi:"へやを そうじして もらえませんか。",zh:"可以幫我打掃房間嗎？",grammar:"てもらえませんか",group:2},{id:41,ja:"会議が始まるまでに、資料を作ります。",yomi:"かいぎが はじまるまでに、しりょうを つくります。",zh:"在會議開始前把資料做好。",grammar:"までに",group:2},{id:
