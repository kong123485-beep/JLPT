<script>
const DATA = [{"id": 1, "jp": "明日は早く起きなければなりません。", "furi": "あしたは はやく おきなければ なりません。", "zh": "明天必須早起。", "tag": "義務", "group": 1, "groupLabel": "N4最愛考句型 - 義務・許可・授受"}, {"id": 2, "jp": "明日は来なくてもいいです。", "furi": "あしたは こなくても いいです。", "zh": "明天不來也沒關係。", "tag": "許可", "group": 1, "groupLabel": "N4最愛考句型 - 義務・許可・授受"}, {"id": 3, "jp": "ここでタバコを吸ってはいけません。", "furi": "ここで たばこを すっては いけません。", "zh": "這裡不能抽煙。", "tag": "禁止", "group": 1, "groupLabel": "N4最愛考句型 - 義務・許可・授受"}, {"id": 4, "jp": "私は友達にプレゼントをあげました。", "furi": "わたしは ともだちに ぷれぜんとを あげました。", "zh": "我送禮物給朋友。", "tag": "あげる", "group": 1, "groupLabel": "N4最愛考句型 - 義務・許可・授受"}, {"id": 5, "jp": "友達が私にプレゼントをくれました。", "furi": "ともだちが わたしに ぷれぜんとを くれました。", "zh": "朋友送禮物給我。", "tag": "くれる", "group": 1, "groupLabel": "N4最愛考句型 - 義務・許可・授受"}, {"id": 6, "jp": "私は友達にプレゼントをもらいました。", "furi": "わたしは ともだちに ぷれぜんとを もらいました。", "zh": "我收到朋友的禮物。", "tag": "もらう", "group": 1, "groupLabel": "N4最愛考句型 - 義務・許可・授受"}, {"id": 7, "jp": "先生に日本語を教えてもらいました。", "furi": "せんせいに にほんごを おしえてもらいました。", "zh": "我請老師教我日文。", "tag": "てもらう", "group": 1, "groupLabel": "N4最愛考句型 - 義務・許可・授受"}, {"id": 8, "jp": "春になると、桜が咲きます。", "furi": "はるに なると、さくらが さきます。", "zh": "一到春天櫻花就開。", "tag": "と", "group": 1, "groupLabel": "N4最愛考句型 - 義務・許可・授受"}, {"id": 9, "jp": "安ければ、この服を買います。", "furi": "やすければ、このふくを かいます。", "zh": "如果便宜就買這件衣服。", "tag": "ば", "group": 1, "groupLabel": "N4最愛考句型 - 義務・許可・授受"}, {"id": 10, "jp": "雨が降ったら、出かけません。", "furi": "あめが ふったら、でかけません。", "zh": "如果下雨就不出門。", "tag": "たら", "group": 1, "groupLabel": "N4最愛考句型 - 義務・許可・授受"}, {"id": 11, "jp": "日本語が分からなかったら、聞いてください。", "furi": "にほんごが わからなかったら、きいてください。", "zh": "如果不懂日文請問我。", "tag": "たら", "group": 1, "groupLabel": "N4最愛考句型 - 義務・許可・授受"}, {"id": 12, "jp": "行くなら、連絡してください。", "furi": "いくなら、れんらくしてください。", "zh": "如果要去請聯絡我。", "tag": "なら", "group": 1, "groupLabel": "N4最愛考句型 - 義務・許可・授受"}, {"id": 13, "jp": "日本へ日本語を勉強しに行きます。", "furi": "にほんへ にほんごを べんきょうしに いきます。", "zh": "去日本學日文。", "tag": "に行く", "group": 1, "groupLabel": "N4最愛考句型 - 義務・許可・授受"}, {"id": 14, "jp": "忘れ物をしたので、家に帰りました。", 動詞變化 - 可能・てみる・てしまう"}, {"id": 28, "jp": "明日は雨が降るそうです。", "furi": "あしたは あめが ふるそうです。", "zh": "聽說明天會下雨。", "tag": "伝聞そうだ", "group": 2, "groupLabel": "N4動詞變化 - 可能・てみる・てしまう"}, {"id": 29, "jp": "このケーキは美味しそうです。", "furi": "このけーきは おいしそうです。", "zh": "這個蛋糕看起來很好吃。", "tag": "様態そうだ", "group": 2, "groupLabel": "N4動詞變化 - 可能・てみる・てしまう"}, {"id": 30, "jp": "あの人は学生のようです。", "furi": "あのひとは がくせいの ようです。", "zh": "那個人好像是學生。", "tag": "ようだ", "group": 2, "groupLabel": "N4動詞變化 - 可能・てみる・てしまう"}, {"id": 31, "jp": "彼は来ないみたいです。", "furi": "かれは こないみたいです。", "zh": "他好像不會來。", "tag": "みたい", "group": 2, "groupLabel": "N4動詞變化 - 可能・てみる・てしまう"}, {"id": 32, "jp": "日本へ行ったことがありますか。", "furi": "にほんへ いったことが ありますか。", "zh": "有去過日本嗎？", "tag": "たことがある", "group": 2, "groupLabel": "N4動詞變化 - 可能・てみる・てしまう"}, {"id": 33, "jp": "まだ宿題をしていません。", "furi": "まだ しゅくだいを していません。", "zh": "還沒做功課。", "tag": "まだ〜ていない", "group": 2, "groupLabel": "N4動詞變化 - 可能・てみる・てしまう"}, {"id": 34, "jp": "もう昼ご飯を食べました。", "furi": "もう ひるごはんを たべました。", "zh": "已經吃過午餐了。", "tag": "もう", "group": 2, "groupLabel": "N4動詞變化 - 可能・てみる・てしまう"}, {"id": 35, "jp": "難しくて、できません。", "furi": "むずかしくて、できません。", "zh": "很難所以做不到。", "tag": "て", "group": 2, "groupLabel": "N4動詞變化 - 可能・てみる・てしまう"}, {"id": 36, "jp": "辞書を使いながら、勉強します。", "furi": "じしょを つかいながら、べんきょうします。", "zh": "一邊用字典一邊學習。", "tag": "ながら", "group": 2, "groupLabel": "N4動詞變化 - 可能・てみる・てしまう"}, {"id": 37, "jp": "子供でも、この本が読めます。", "furi": "こどもでも、このほんが よめます。", "zh": "即使是小孩也能讀這本書。", "tag": "でも", "group": 2, "groupLabel": "N4動詞變化 - 可能・てみる・てしまう"}, {"id": 38, "jp": "電車に乗り遅れたので、会社に遅れました。", "furi": "でんしゃに のりおくれたので、かいしゃに おくれました。", "zh": "因為沒趕上電車所以上班遲到了。", "tag": "ので", "group": 2, "groupLabel": "N4動詞變化 - 可能・てみる・てしまう"}, {"id": 39, "jp": "この時計は父に買ってもらいました。", "furi": "このとけいは ちちに かってもらいました。", "zh": "這個錶是爸爸買給我的。", "tag": "買ってもらう", "group": 2, "groupLabel": "N4動詞變化 - 可能・てみる・てしまう"}, {"id": 40, "jp": "部屋を掃除してもらえませんか。", "furi": "へやを そうじして もらえませんか。", "zh": "可以幫我打掃房間嗎？", "tag": "てもらえませんか", "group": 2, "groupLabel": "N4動詞變化 - 可能・てみる・てしまう"}, {"id": 41, "jp": "会議が始まるまでに、資料を作ります。", "furi": "かいぎが はじまるまでに、しりょうを つくります。", "zh": "在會議開始前把資料做好。", "tag": "までに", "group": 2, "groupLabel": "N4動詞變化 - 可能・てみる・てしまう"}, {"id": 42, "jp": "すみません、もう一度言ってください。", "furi": "すみません、もういちど いってください。", "zh": "不好意思請再說一次。", "tag": "聽解定番", "group": 3, "groupLabel": "N4聽解救命 - 伝聞・様態・確認"}, {"id": 43, "jp": "〜という意味ですか。", "furi": "〜といういみですか。", "zh": "是...的意思嗎？", "tag": "確認", "group": 3, "groupLabel": "N4聽解救命 - 伝聞・様態・確認"}, {"id": 44, "jp": "ちょっと手伝ってください。", "furi": "ちょっと てつだってください。", "zh": "請幫我一下。", "tag": "依頼", "group": 3, "groupLabel": "N4聽解救命 - 伝聞・様態・確認"}, {"id": 45, "jp": "電車が遅れているので、遅れます。", "furi": "でんしゃが おくれているので、おくれます。", "zh": "因為電車誤點所以會遲到。", "tag": "遲到理由", "group": 3, "groupLabel": "N4聽解救命 - 伝聞・様態・確認"}, {"id": 46, "jp": "道が混んでいるので、バスが来ません。", "furi": "みちが こんでいるので、ばすが きません。", "zh": "因為塞車所以巴士不來。", "tag": "交通", "group": 3, "groupLabel": "N4聽解救命 - 伝聞・様態・確認"}, {"id": 47, "jp": "6時に来るはずです。", "furi": "ろくじに くるはずです。", "zh": "應該6點會來。", "tag": "はず", "group": 3, "groupLabel": "N4聽解救命 - 伝聞・様態・確認"}, {"id": 48, "jp": "雨が降るかもしれません。", "furi": "あめが ふるかもしれません。", "zh": "也許會下雨。", "tag": "かもしれません", "group": 3, "groupLabel": "N4聽解救命 - 伝聞・様態・確認"}, {"id": 49, "jp": "ここに車を止めないでください。", "furi": "ここに くるまを とめないでください。", "zh": "請不要在這裡停車。", "tag": "ないで", "group": 3, "groupLabel": "N4聽解救命 - 伝聞・様態・確認"}, {"id": 50, "jp": "行かなきゃ！", "furi": "いかなきゃ！", "zh": "得去了！", "tag": "口語なきゃ", "group": 3, "groupLabel": "N4聽解救命 - 伝聞・様態・確認"}, {"id": 51, "jp": "私は頭がいいわけではありません。", "furi": "わたしは あたまが いいわけでは ありません。", "zh": "並不是說我很聰明。", "tag": "わけではない", "group": 4, "groupLabel": "N4衝刺 - すぎる・まま・はず・決意"}, {"id": 52, "jp": "明日までに宿題を出さなければなりません。", "furi": "あしたまでに しゅくだいを ださなければなりません。", "zh": "功課必須在明天前交。", "tag": "までに", "group": 4, "groupLabel": "N4衝刺 - すぎる・まま・はず・決意"}, {"id": 53, "jp": "この服は高すぎて、買えません。", "furi": "このふくは たかすぎて、かえません。", "zh": "這件衣服太貴買不起。", "tag": "すぎる", "group": 4, "groupLabel": "N4衝刺 - すぎる・まま・はず・決意"}, {"id": 54, "jp": "日本語が上手になるように、頑張ります。", "furi": "にほんごが じょうずに なるように、がんばります。", "zh": "為了日文變好我會加油。", "tag": "ように", "group": 4, "groupLabel": "N4衝刺 - すぎる・まま・はず・決意"}, {"id": 55, "jp": "電気を消したまま、出かけました。", "furi": "でんきを けしたまま、でかけました。", "zh": "沒關燈就出門了。", "tag": "まま", "group": 4, "groupLabel": "N4衝刺 - すぎる・まま・はず・決意"}, {"id": 56, "jp": "雨が降っているのに、出かけます。", "furi": "あめが ふっているのに、でかけます。", "zh": "明明在下雨卻出門。", "tag": "のに", "group": 4, "groupLabel": "N4衝刺 - すぎる・まま・はず・決意"}, {"id": 57, "jp": "この料理は作り方が簡単です。", "furi": "このりょうりは つくりかたが かんたんです。", "zh": "這道菜的做法很簡單。", "tag": "方", "group": 4, "groupLabel": "N4衝刺 - すぎる・まま・はず・決意"}, {"id": 58, "jp": "あのレストランは行ったほうがいいですよ。", "furi": "あのれすとらんは いったほうが いいですよ。", "zh": "那間餐廳最好去一次。", "tag": "たほうがいい", "group": 4, "groupLabel": "N4衝刺 - すぎる・まま・はず・決意"}, {"id": 59, "jp": "行かないほうがいいですよ。", "furi": "いかないほうが いいですよ。", "zh": "最好不要去。", "tag": "ないほうがいい", "group": 4, "groupLabel": "N4衝刺 - すぎる・まま・はず・決意"}, {"id": 60, "jp": "私は明日までにレポートを書かなければならないのに、まだ書いていません。", "furi": "わたしは あしたまでに れぽーとを かかなければならないのに、まだ かいていません。", "zh": "明明明天前必須寫完報告卻還沒寫。", "tag": "綜合", "group": 4, "groupLabel": "N4衝刺 - すぎる・まま・はず・決意"}, {"id": 61, "jp": "旅行の前に、切符を買っておきます。", "furi": "りょこうのまえに、きっぷを かっておきます。", "zh": "旅行前先把票買好。", "tag": "ておく", "group": 4, "groupLabel": "N4衝刺 - すぎる・まま・はず・決意"}, {"id": 62, "jp": "友達が荷物を持ってくれました。", "furi": "ともだちが にもつを もってくれました。", "zh": "朋友幫我拿了行李。", "tag": "てくれる", "group": 4, "groupLabel": "N4衝刺 - すぎる・まま・はず・決意"}, {"id": 63, "jp": "私が日本語を教えてあげます。", "furi": "わたしが にほんごを おしえてあげます。", "zh": "我來教你日文吧。", "tag": "てあげる", "group": 4, "groupLabel": "N4衝刺 - すぎる・まま・はず・決意"}, {"id": 64, "jp": "行かなければ、先生に怒られます。", "furi": "いかなければ、せんせいに おこられます。", "zh": "如果不去會被老師罵。", "tag": "なければ", "group": 4, "groupLabel": "N4衝刺 - すぎる・まま・はず・決意"}, {"id": 65, "jp": "雨が降っても、行きます。", "furi": "あめが ふっても、いきます。", "zh": "即使下雨也去。", "tag": "ても", "group": 4, "groupLabel": "N4衝刺 - すぎる・まま・はず・決意"}, {"id": 66, "jp": "写真を撮ってもいいですか。", "furi": "しゃしんを とってもいいですか。", "zh": "可以拍照嗎？", "tag": "てもいい", "group": 4, "groupLabel": "N4衝刺 - すぎる・まま・はず・決意"}, {"id": 67, "jp": "入っちゃいけない。", "furi": "はいっちゃいけない。", "zh": "不能進去。", "tag": "ちゃいけない口語", "group": 4, "groupLabel": "N4衝刺 - すぎる・まま・はず・決意"}, {"id": 68, "jp": "健康のために、タバコをやめることにしました。", "furi": "けんこうのために、たばこを やめることにしました。", "zh": "為了健康決定戒煙。", "tag": "ことにする", "group": 4, "groupLabel": "N4衝刺 - すぎる・まま・はず・決意"}, {"id": 69, "jp": "来月、転勤することになりました。", "furi": "らいげつ、てんきんすることに なりました。", "zh": "下個月決定要調職了。", "tag": "ことになる", "group": 4, "groupLabel": "N4衝刺 - すぎる・まま・はず・決意"}, {"id": 70, "jp": "今から出かけるところです。", "furi": "いまから でかけるところです。", "zh": "正要出門。", "tag": "ところ", "group": 4, "groupLabel": "N4衝刺 - すぎる・まま・はず・決意"}];
let filtered=[...DATA];
let mem=JSON.parse(localStorage.getItem('n4_mem_v2')||'[]');
let rate=0.9;
let isPlaying=false;
let curIdx=0;
let tId=null;
let synth=window.speechSynthesis;
let voice=null;
let isFirstPlay=true;
function loadV(){ const vs=synth.getVoices(); voice=vs.find(v=>v.lang.includes('ja')&&v.name.toLowerCase().includes('google'))||vs.find(v=>v.lang.includes('ja'))||vs[0]||null; }
loadV(); if(synth.onvoiceschanged!==undefined) synth.onvoiceschanged=loadV;
function setRate(r){ rate=r; document.getElementById('rate09').className=r===0.9?'h-10 px-4 rounded-full bg-indigo-600 text-white text-sm font-bold':'h-10 px-4 rounded-full bg-white border text-sm font-bold'; document.getElementById('rate06').className=r===0.6?'h-10 px-4 rounded-full bg-indigo-600 text-white text-sm font-bold':'h-10 px-4 rounded-full bg-white border text-sm font-bold'; }
function speak(text, cb){
 // 修復第一句播不到：第一次不cancel，直接播；之後先cancel
 if(!isFirstPlay){ try{synth.cancel();}catch(e){} } else { isFirstPlay=false; }
 // 保障：確保有voice，iOS需要
 if(synth.getVoices().length===0){ loadV(); }
 const u=new SpeechSynthesisUtterance(text);
 u.lang='ja-JP'; u.rate=rate; u.volume=1;
 if(voice) u.voice=voice;
 let called=false;
 const done=()=>{ if(called) return; called=true; if(cb) cb(); };
 u.onend=done;
 u.onerror=(e)=>{ console.log('speech err', e.error); done(); };
 // iOS保險：150ms後如果仲未開始，再試一次
 setTimeout(()=>{
  try{ synth.speak(u); }catch(e){ console.log(e); done(); }
  // 如果0.8秒後仲未播（first句常見），強制重播
  setTimeout(()=>{ if(synth.speaking===false && !called){ console.log('retry first'); try{synth.speak(u);}catch(e){} } }, 800);
 }, isFirstPlay?10:90);
}
function stopAll(){
 isPlaying=false; isFirstPlay=true;
 if(tId){clearTimeout(tId); tId=null;}
 try{synth.cancel();}catch(e){}
 setTimeout(()=>{try{synth.cancel();}catch(e){}}, 120);
 update();
}
function scrollToIdx(i){ const item=filtered[i]; if(!item) return; const el=document.getElementById('c-'+item.id); if(!el) return; const hdr=document.getElementById('hdr').offsetHeight; const top=el.getBoundingClientRect().top+window.scrollY-hdr-16; window.scrollTo({top, behavior:'smooth'}); }
function update(){ document.getElementById('progWrap').classList.toggle('hidden', !isPlaying); document.getElementById('bottomBar').classList.toggle('hidden', !isPlaying); document.getElementById('stopTop').classList.toggle('hidden', !isPlaying); document.getElementById('playAll').classList.toggle('hidden', isPlaying); if(isPlaying){ const tot=filtered.length; const cur=Math.min(curIdx+1,tot); document.getElementById('progTxt').textContent=`正在播放: 第 ${cur} 句 / ${tot}`; document.getElementById('progCnt').textContent=`${cur}/${tot}`; document.getElementById('progBar').style.width=`${(cur/tot)*100}%`; document.getElementById('bCount').textContent=`第 ${cur} / ${tot} 句`; document.getElementById('bBar').style.width=`${(cur/tot)*100}%`; const s=filtered[curIdx]; if(s){document.getElementById('bJp').textContent=s.jp; document.getElementById('bZh').textContent=s.zh;} } render(); }
function render(){ const grid=document.getElementById('grid'); grid.innerHTML=''; filtered.forEach((s,i)=>{ const isCur=isPlaying&&i===curIdx; const isM=mem.includes(s.id); const d=document.createElement('div'); d.id='c-'+s.id; d.className=`rounded-[18px] border p-4 bg-white transition-all ${isCur?'ring-2 ring-indigo-500 bg-indigo-50/80 shadow-md scale-[1.01]':'border-zinc-200'}`; d.innerHTML=`<div class="flex justify-between gap-2"><div class="flex gap-2 items-center flex-wrap"><span class="min-w-7 h-7 grid place-items-center rounded-full ${isCur?'bg-indigo-600 text-white':'bg-zinc-900 text-white'} text-xs font-bold">${s.id}</span><span class="text-[11px] px-2 py-0.5 rounded-full bg-indigo-50 border border-indigo-200 text-indigo-700">${s.tag}</span>${isCur?'<span class="text-[11px] px-2 py-0.5 rounded-full bg-indigo-600 text-white animate-pulse">播放中</span>':''}</div><label class="text-[11px] flex gap-1 items-center"><input type="checkbox" ${isM?'checked':''} data-mem="${s.id}">已背</label></div><div class="jp mt-3 text-[18px] font-bold leading-[1.6]">${s.jp}</div><div class="mt-1 text-[13px] text-zinc-500">${s.furi}</div><div class="mt-2 text-[14px] text-zinc-700">${s.zh}</div><div class="mt-4 flex gap-2 flex-wrap"><button data-p="${s.id}" class="h-9 px-3.5 rounded-full bg-zinc-900 text-white text-xs font-bold">▶ 播放</button><button data-ps="${s.id}" class="h-9 px-3.5 rounded-full bg-white border text-xs font-bold">0.6x</button><button data-from="${i}" class="h-9 px-3.5 rounded-full bg-indigo-50 border border-indigo-200 text-indigo-700 text-xs font-bold">從此句全部播放</button></div>`; grid.appendChild(d); }); document.getElementById('showCnt').textContent=`顯示 ${filtered.length} 句`; document.getElementById('memCnt').textContent=`已背 ${mem.length}`; grid.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ const id=+b.dataset.p; const s=DATA.find(x=>x.id===id); stopAll(); setRate(0.9); isFirstPlay=true; speak(s.jp); }); grid.querySelectorAll('[data-ps]').forEach(b=>b.onclick=()=>{ const id=+b.dataset.ps; const s=DATA.find(x=>x.id===id); stopAll(); setRate(0.6); isFirstPlay=true; speak(s.jp); }); grid.querySelectorAll('[data-from]').forEach(b=>b.onclick=()=>{ playFrom(+b.dataset.from); }); grid.querySelectorAll('[data-mem]').forEach(cb=>cb.onchange=()=>{ const id=+cb.dataset.mem; if(cb.checked){ if(!mem.includes(id)) mem.push(id); } else { mem=mem.filter(x=>x!==id); } localStorage.setItem('n4_mem_v2', JSON.stringify(mem)); }); }
function playFrom(start){ stopAll(); isPlaying=true; curIdx=start; isFirstPlay=true; function nxt(){ if(!isPlaying) return; if(curIdx>=filtered.length){ stopAll(); return; } update(); scrollToIdx(curIdx); const s=filtered[curIdx]; speak(s.jp, ()=>{ if(!isPlaying) return; curIdx++; tId=setTimeout(nxt, 650); }); } // 第一句延遲多100ms，確保voice ready
 setTimeout(nxt, 150);
}
document.getElementById('search').addEventListener('input', e=>{ const q=e.target.value.trim().toLowerCase(); if(!q) filtered=[...DATA]; else filtered=DATA.filter(s=> s.jp.includes(q)||s.zh.includes(q)||s.furi.includes(q)||s.tag.toLowerCase().includes(q)); if(isPlaying) stopAll(); render(); });
document.querySelectorAll('.gbtn').forEach(btn=>{ btn.onclick=()=>{ document.querySelectorAll('.gbtn').forEach(b=>b.className='gbtn h-8 px-3 rounded-full bg-white border text-xs whitespace-nowrap'); btn.className='gbtn h-8 px-3 rounded-full bg-zinc-900 text-white text-xs font-bold whitespace-nowrap'; const g=btn.dataset.g; if(g==='all') filtered=[...DATA]; else filtered=DATA.filter(s=>s.group===+g); const q=document.getElementById('search').value.trim().toLowerCase(); if(q) filtered=filtered.filter(s=> s.jp.includes(q)||s.zh.includes(q)); if(isPlaying) stopAll(); render(); }; });
document.getElementById('playAll').onclick=()=>playFrom(0);
document.getElementById('stopTop').onclick=()=>stopAll();
document.getElementById('bStop').onclick=()=>stopAll();
document.getElementById('rate09').onclick=()=>setRate(0.9);
document.getElementById('rate06').onclick=()=>setRate(0.6);
setRate(0.9); render();
</script>
