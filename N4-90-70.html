す。",yomi:"なつやすみに りょこうする つもりです。",zh:"打算暑假去旅行。",grammar:"つもり",group:2},{id:27,ja:"来月、引っ越す予定です。",yomi:"らいげつ、ひっこす よていです。",zh:"預定下個月搬家。",grammar:"予定",group:2},{id:28,ja:"明日は雨が降るそうです。",yomi:"あしたは あめが ふるそうです。",zh:"聽說明天會下雨。",grammar:"伝聞そうだ",group:2},{id:29,ja:"このケーキは美味しそうです。",yomi:"このけーきは おいしそうです。",zh:"這個蛋糕看起來很好吃。",grammar:"様態そうだ",group:2},{id:30,ja:"あの人は学生のようです。",yomi:"あのひとは がくせいの ようです。",zh:"那個人好像是學生。",grammar:"ようだ",group:2},{id:31,ja:"彼は来ないみたいです。",yomi:"かれは こないみたいです。",zh:"他好像不會來。",grammar:"みたい",group:2},{id:32,ja:"日本へ行ったことがありますか。",yomi:"にほんへ いったことが ありますか。",zh:"有去過日本嗎？",grammar:"たことがある",group:2},{id:33,ja:"まだ宿題をしていません。",yomi:"まだ しゅくだいを していません。",zh:"還沒做功課。",grammar:"まだ〜ていない",group:2},{id:34,ja:"もう昼ご飯を食べました。",yomi:"もう ひるごはんを たべました。",zh:"已經吃過午餐了。",grammar:"もう",group:2},{id:35,ja:"難しくて、できません。",yomi:"むずかしくて、できません。",zh:"很難所以做不到。",grammar:"て",group:2},{id:36,ja:"辞書を使いながら、勉強します。",yomi:"じしょを つかいながら、べんきょうします。",zh:"一邊用字典一邊學習。",grammar:"ながら",group:2},{id:37,ja:"子供でも、この本が読めます。",yomi:"こどもでも、このほんが よめます。",zh:"即使是小孩也能讀這本書。",grammar:"でも",group:2},{id:38,ja:"電車に乗り遅れたので、会社に遅れました。",yomi:"でんしゃに のりおくれたので、かいしゃに おくれました。",zh:"因為沒趕上電車所以上班遲到了。",grammar:"ので",group:2},{id:39,ja:"この時計は父に買ってもらいました。",yomi:"このとけいは ちちに かってもらいました。",zh:"這個錶是爸爸買給我的。",grammar:"買ってもらう",group:2},{id:40,ja:"部屋を掃除してもらえませんか。",yomi:"へやを そうじして もらえませんか。",zh:"可以幫我打掃房間嗎？",grammar:"てもらえませんか",group:2},{id:41,ja:"会議が始まるまでに、資料を作ります。",yomi:"かいぎが はじまるまでに、しりょうを つくります。",zh:"在會議開始前把資料做好。",grammar:"までに",group:2},{id:42,ja:"すみません、もう一度言ってください。",yomi:"すみません、もういちど いってください。",zh:"不好意思請再說一次。",grammar:"聽解定番",group:3},{id:43,ja:"〜という意味ですか。",yomi:"〜といういみですか。",zh:"是...的意思嗎？",grammar:"確認",group:3},{id:44,ja:"ちょっと手伝ってください。",yomi:"ちょっと てつだってください。",zh:"請幫我一下。",grammar:"依頼",group:3},{id:45,ja:"電車が遅れているので、遅れます。",yomi:"でんしゃが おくれているので、おくれます。",zh:"因為電車誤點所以會遲到。",grammar:"遲到理由",group:3},{id:46,ja:"道が混んでいるので、バスが来ません。",yomi:"みちが こんでいるので、ばすが きません。",zh:"因為塞車所以巴士不來。",grammar:"交通",group:3},{id:47,ja:"6時に来るはずです。",yomi:"ろくじに くるはずです。",zh:"應該6點會來。",grammar:"はず",group:3},{id:48,j
