4最愛考句型 - 義務・許可・授受"},{id:16,jp:"日本語が上手になるように、毎日練習しています。",furi:"にほんごが じょうずに なるように、まいにち れんしゅうしています。",zh:"為了日文變好每天練習。",tag:"ように",group:1,groupLabel:"N4最愛考句型 - 義務・許可・授受"},{id:17,jp:"日本語が話せます。",furi:"にほんごが はなせます。",zh:"會說日文。",tag:"可能形",group:2,groupLabel:"N4動詞變化 - 可能・てみる・てしまう"},{id:18,jp:"この漢字が読めません。",furi:"このかんじが よめません。",zh:"這個漢字看不懂。",tag:"可能形否定",group:2,groupLabel:"N4動詞變化 - 可能・てみる・てしまう"},{id:19,jp:"ケーキを作ってみました。",furi:"けーきを つくってみました。",zh:"試著做了蛋糕。",tag:"てみる",group:2,groupLabel:"N4動詞變化 - 可能・てみる・てしまう"},{id:20,jp:"宿題を忘れてしまいました。",furi:"しゅくだいを わすれてしまいました。",zh:"不小心忘了功課。",tag:"てしまう",group:2,groupLabel:"N4動詞變化 - 可能・てみる・てしまう"},{id:21,jp:"窓が開けてあります。",furi:"まどが あけてあります。",zh:"窗戶是開著的(有人故意開的)。",tag:"てある",group:2,groupLabel:"N4動詞變化 - 可能・てみる・てしまう"},{id:22,jp:"窓が開いています。",furi:"まどが あいています。",zh:"窗戶開著。",tag:"ている",group:2,groupLabel:"N4動詞變化 - 可能・てみる・てしまう"},{id:23,jp:"財布が落ちていました。",furi:"さいふが おちていました。",zh:"錢包掉了在地上。",tag:"ていた",group:2,groupLabel:"N4動詞變化 - 可能・てみる・てしまう"},{id:24,jp:"週末、映画を見ようと思っています。",furi:"しゅうまつ、えいがを みようと おもっています。",zh:"打算週末看電影。",tag:"ようと思う",group:2,groupLabel:"N4動詞變化 - 可能・てみる・てしまう"},{id:25,jp:"明日、雨が降るでしょう。",furi:"あした、あめが ふるでしょう。",zh:"明天大概會下雨吧。",tag:"でしょう",group:2,groupLabel:"N4動詞變化 - 可能・てみる・てしまう"},{id:26,jp:"夏休みに旅行するつもりです。",furi:"なつやすみに りょこうする つもりです。",zh:"打算暑假去旅行。",tag:"つもり",group:2,groupLabel:"N4動詞變化 - 可能・てみる・てしまう"},{id:27,jp:"来月、引っ越す予定です。",furi:"らいげつ、ひっこす よていです。",zh:"預定下個月搬家。",tag:"予定",group:2,groupLabel:"N4動詞變化 - 可能・てみる・てしまう"},{id:28,jp:"明日は雨が降るそうです。",furi:"あしたは あめが ふるそうです。",zh:"聽說明天會下雨。",tag:"伝聞そうだ",group:2,groupLabel:"N4動詞變化 - 可能・てみる・てしまう"},{id:29,jp:"このケーキは美味しそうです。",furi:"このけーきは おいしそうです。",zh:"這個蛋糕看起來很好吃。",tag:"様態そうだ",group:2,groupLabel:"N4動詞變化 - 可能・てみる・てしまう"},{id:30,jp:"あの人は学生のようです。",furi:"あのひとは がくせいの ようです。",zh:"那個人好像是學生。",tag:"ようだ",group:2,groupLabel:"N4動詞變化 - 可能・てみる・てしまう"},{id:31,jp:"彼は来ないみたいです。",furi:"かれは こないみたいです。",zh:"他好像不會來。",tag:"みたい",group:2,groupLabel:"N4動詞變化 - 可能・てみる・てしまう"},{id:32,jp:"日本へ行ったことがありますか。",furi:"にほんへ いったことが ありますか。",zh:"有去過日本嗎？",tag:"たことがある",group:2,groupLabel:"N4動詞變化 - 可能・てみる・てしまう"},{id:33,jp:"まだ宿題をしていません。",furi:"まだ しゅくだいを していません。",zh:"還沒做功課。",tag:"まだ〜ていない",group:2,groupLabel:"N4動詞變化 - 可能・てみる・てしまう"},{id:34,jp:"もう昼ご飯を食べました。",furi:"もう ひるごはんを たべました。",zh:"已經吃過午餐了。",tag:"もう",group:2,groupLabel:"N4動詞變化 - 可能・てみる・てしまう"},{id:35,jp:"難しくて、できません。",furi:"むずかしくて、できません。",zh:"很難所以做不到。",tag:"て",group:2,groupLabel:"N4動詞變化 - 可能・てみる・てしまう"},{id:36,jp:"辞書を使いながら、勉強します。",furi:"じしょを つかいながら、べんきょうします。",zh:"一邊用字典一邊學習。",tag:"ながら",group:2,groupLabel:"N4動詞變化 - 可能・てみる・てしまう"},{id:37,jp:"子供でも、この本が読めます。",furi:"こどもでも、このほんが よめます。",zh:"即使是小孩也能讀這本書。",tag:"でも",group:2,groupLabel:"N4動詞變化 - 可能・てみる・てしまう"},{id:38,jp:"電車に乗り遅れたので、会社に遅れました。",furi:"でんしゃに のりおくれたので、かいしゃに おくれました。",zh:"因為沒趕上電車所以上班遲到了。",tag:"ので",group:2,groupLabel:"N4動詞變化 - 可能・てみる・てしまう"},{id:39,jp:"この時計は父に買ってもらいました。",furi:"このとけいは ちちに かってもらいました。",zh:"這個錶是爸爸買給我的。",tag:"買ってもらう",group:2,groupLabel:"N4動詞變化 - 可能・てみる・てしまう"},{id:40,jp:"部屋を掃除してもらえませんか。",furi:"へやを そうじして もらえませんか。",zh:"可以幫我打掃房間嗎？",tag:"てもらえませんか",group:2,groupLabel:"N4動詞變化 - 可能・てみる・てしまう"},{id:41,jp:"会議が始まるまでに、資料を作ります。",furi:"かいぎが はじまるまでに、しりょうを つくります。",zh:"在會議開始前把資料做好。",tag:"までに",group:2,groupLabel:"N4動詞變化 - 可能・てみる・てしまう"},{id:42,jp:"すみません、もう一度言ってください。",furi:"すみません、もういちど いってください。",zh:"不好意思請再說一次。",tag:"聽解定番",group:3,groupLabel:"N4聽解救命 - 伝聞・様態・確認"},{id:43,jp:"〜という意味ですか。",furi:"〜といういみですか。",zh:"是...的意思嗎？",tag:"確認",group:3,groupLabel:"N4聽解救命 - 伝聞・様態・確認"},{id:44,jp:"ちょっと手伝ってください。",furi:"ちょっと てつだってください。",zh:"請幫我一下。",tag:"依頼",group:3,groupLabel:"N4聽解救命 - 伝聞・様態・確認"},{id:45,jp:"電車が遅れているので、遅れます。",furi:"でんしゃが おくれているので、おくれます。",zh:"因為電車誤點所以會遲到。",tag:"遲到理由",group:3,groupLabel:"N4聽解救命 - 伝聞・様態・確認"},{id:46,jp:"道が混んでいるので、バスが来ません。",furi:"みちが こんでいるので、ばすが きません。",zh:"因為塞車所以巴士不來。",tag:"交通",group:3,groupLabel:"N4聽解救命 - 伝聞・様態・確認"},{id:47,jp:"6時に来るはずです。",furi:"ろくじに くるはずです。",zh:"應該6點會來。",tag:"はず",group:3,groupLabel:"N4聽解救命 - 伝聞・様態・確認"},{id:48,jp:"雨が降るかもしれません。",furi:"あめが ふるかもしれません。",zh:"也許會下雨。",tag:"かもしれません",group:3,groupLabel:"N4聽解救命 - 伝聞・様態・確認"},{id:49,jp:"ここに車を止めないでください。",furi:"ここに くるまを とめないでください。",zh:"請不要在這裡停車。",tag:"ないで",group:3,groupLabel:"N4聽解救命 - 伝聞・様態・確認"},{id:50,jp:"行かなきゃ！",furi:"いかなきゃ！",zh:"得去了！",tag:"口語なきゃ",group:3,groupLabel:"N4聽解救命 - 伝聞・様態・確認"},{id:51,jp:"私は頭がいいわけではありません。",furi:"わたしは あたまが いいわけでは ありません。",zh:"並不是說我很聰明。",tag:"わけではない",group:4,groupLabel:"N4衝刺 - すぎる・まま・はず・決意"},{id:52,jp:"明日までに宿題を出さなければなりません。",furi:"あしたまでに しゅくだいを ださなければなりません。",zh:"功課必須在明天前交。",tag:"までに",group:4,groupLabel:"N4衝刺 - すぎる・まま・はず・決意"},{id:53,jp:"この服は高すぎて、買えません。",furi:"このふくは たかすぎて、かえません。",zh:"這件衣服太貴買不起。",tag:"すぎる",group:4,groupLabel:"N4衝刺 - すぎる・まま・はず・決意"},{id:54,jp:"日本語が上手になるように、頑張ります。",furi:"にほんごが じょうずに なるように、がんばります。",zh:"為了日文變好我會加油。",tag:"ように",group:4,groupLabel:"N4衝刺 - すぎる・まま・はず・決意"},{id:55,jp:"電気を消したまま、出かけました。",furi:"でんきを けしたまま、でかけました。",zh:"沒關燈就出門了。",tag:"まま",group:4,groupLabel:"N4衝刺 - すぎる・まま・はず・決意"},{id:56,jp:"雨が降っているのに、出かけます。",furi:"あめが ふっているのに、でかけます。",zh:"明明在下雨卻出門。",tag:"のに",group:4,groupLabel:"N4衝刺 - すぎる・まま・はず・決意"},{id:57,jp:"この料理は作り方が簡単です。",furi:"このりょうりは つくりかたが かんたんです。",zh:"這道菜的做法很簡單。",tag:"方",group:4,groupLabel:"N4衝刺 - すぎる・まま・はず・決意"},{id:58,jp:"あのレストランは行ったほうがいいですよ。",furi:"あのれすとらんは いったほうが いいですよ。",zh:"那間餐廳最好去一次。",tag:"たほうがいい",group:4,groupLabel:"N4衝刺 - すぎる・まま・はず・決意"},{id:59,jp:"行かないほうがいいですよ。",furi:"いかないほうが いいですよ。",zh:"最好不要去。",tag:"ないほうがいい",group:4,groupLabel:"N4衝刺 - すぎる・まま・はず・決意"},{id:60,jp:"私は明日までにレポートを書かなければならないのに、まだ書いていません。",furi:"わたしは あしたまでに れぽーとを かかなければならないのに、まだ かいていません。",zh:"明明明天前必須寫完報告卻還沒寫。",tag:"綜合",group:4,groupLabel:"N4衝刺 - すぎる・まま・はず・決意"},{id:61,jp:"旅行の前に、切符を買っておきます。",furi:"りょこうのまえに、きっぷを かっておきます。",zh:"旅行前先把票買好。",tag:"ておく",group:4,groupLabel:"N4衝刺 - すぎる・まま・はず・決意"},{id:62,jp:"友達が荷物を持ってくれました。",furi:"ともだちが にもつを もってくれました。",zh:"朋友幫我拿了行李。",tag:"てくれる",group:4,groupLabel:"N4衝刺 - すぎる・まま・はず・決意"},{id:63,jp:"私が日本語を教えてあげます。",furi:"わたしが にほんごを おしえてあげます。",zh:"我來教你日文吧。",tag:"てあげる",group:4,groupLabel:"N4衝刺 - すぎる・まま・はず・決意"},{id:64,jp:"行かなければ、先生に怒られます。",furi:"いかなければ、せんせいに おこられます。",zh:"如果不去會被老師罵。",tag:"なければ",group:4,groupLabel:"N4衝刺 - すぎる・まま・はず・決意"},{id:65,jp
