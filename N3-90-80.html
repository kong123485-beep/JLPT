:"おくれたのは、でんしゃが とまったからです",zh:"遲到是因為電車停駛。",tag:"わけだ理由",group:1,groupLabel:"N3核心句型 - ておく・ばかり・わけ"},{id:7,jp:"彼は学生のはずです。",furi:"かれは がくせいの はずです",zh:"他應該是學生。",tag:"はずだ確信",group:1,groupLabel:"N3核心句型 - ておく・ばかり・わけ"},{id:8,jp:"彼は来るはずだったのに、来ませんでした。",furi:"かれは くる はずだったのに、きませんでした",zh:"他本應來卻沒來。",tag:"はずだったのに",group:1,groupLabel:"N3核心句型 - ておく・ばかり・わけ"},{id:9,jp:"明日は雨が降るかもしれない。",furi:"あしたは あめが ふる かもしれない",zh:"明天也許會下雨。",tag:"かもしれない",group:1,groupLabel:"N3核心句型 - ておく・ばかり・わけ"},{id:10,jp:"彼は来ないかもしれない。",furi:"かれは こない かもしれない",zh:"他也許不會來。",tag:"かもしれない",group:1,groupLabel:"N3核心句型 - ておく・ばかり・わけ"},{id:11,jp:"彼は来ないだろう。",furi:"かれは こない だろう",zh:"他大概不會來吧。",tag:"だろう推量",group:1,groupLabel:"N3核心句型 - ておく・ばかり・わけ"},{id:12,jp:"明日、雨が降るでしょう。",furi:"あした、あめが ふるでしょう",zh:"明天大概會下雨吧。",tag:"でしょう丁寧",group:1,groupLabel:"N3核心句型 - ておく・ばかり・わけ"},{id:13,jp:"彼は病気のようだ。",furi:"かれは びょうきの ようだ",zh:"他好像生病了。",tag:"ようだ",group:1,groupLabel:"N3核心句型 - ておく・ばかり・わけ"},{id:14,jp:"彼は病気らしい。",furi:"かれは びょうき らしい",zh:"聽說他好像生病了。",tag:"らしい伝聞/推量",group:1,groupLabel:"N3核心句型 - ておく・ばかり・わけ"},{id:15,jp:"彼は病気みたいだ。",furi:"かれは びょうき みたいだ",zh:"他好像生病了口語。",tag:"みたい",group:1,groupLabel:"N3核心句型 - ておく・ばかり・わけ"},{id:16,jp:"このケーキは美味しそうだ。",furi:"この ケーキは おいしそうだ",zh:"這個蛋糕看起來很好吃。",tag:"そうだ様態",group:1,groupLabel:"N3核心句型 - ておく・ばかり・わけ"},{id:17,jp:"明日雨が降るそうだ。",furi:"あした あめが ふるそうだ",zh:"聽說明天會下雨。",tag:"そうだ伝聞",group:1,groupLabel:"N3核心句型 - ておく・ばかり・わけ"},{id:18,jp:"雨が降りそうだ。",furi:"あめが ふりそうだ",zh:"好像要下雨了。",tag:"そうだ直前",group:1,groupLabel:"N3核心句型 - ておく・ばかり・わけ"},{id:19,jp:"彼は日本人っぽい。",furi:"かれは にほんじんっぽい",zh:"他看起來像日本人。",tag:"っぽい",group:1,groupLabel:"N3核心句型 - ておく・ばかり・わけ"},{id:20,jp:"子供っぽい服。",furi:"こどもっぽい ふく",zh:"像小孩的衣服。",tag:"っぽい",group:1,groupLabel:"N3核心句型 - ておく・ばかり・わけ"},{id:21,jp:"雨が降っても、出かけます。",furi:"あめが ふっても、でかけます",zh:"即使下雨也出門。",tag:"ても",group:2,groupLabel:"条件・逆接・複合"},{id:22,jp:"いくら高くても、買います。",furi:"いくら たかくても、かいます",zh:"不管多貴都買。",tag:"ても",group:2,groupLabel:"条件・逆接・複合"},{id:23,jp:"彼は来ると言っていたのに、来なかった。",furi:"かれは くると いっていたのに、こなかった",zh:"他明明說要來卻沒來。",tag:"のに",group:2,groupLabel:"条件・逆接・複合"},{id:24,jp:"頑張ったのに、失敗した。",furi:"がんばったのに、しっぱいした",zh:"明明努力了卻失敗了。",tag:"のに",group:2,groupLabel:"条件・逆接・複合"},{id:25,jp:"雨が降っているので、出かけません。",furi:"あめが ふっているので、でかけません",zh:"因為在下雨所以不出門。",tag:"ので",group:2,groupLabel:"条件・逆接・複合"},{id:26,jp:"雨が降っているから、出かけません。",furi:"あめが ふっているから、でかけません",zh:"因為下雨所以不出門。",tag:"から",group:2,groupLabel:"条件・逆接・複合"},{id:27,jp:"日本へ行くために、日本語を勉強しています。",furi:"にほんへ いくために、にほんごを べんきょうしています",zh:"為了去日本學日文。",tag:"ために目的",group:2,groupLabel:"条件・逆接・複合"},{id:28,jp:"事故のために、電車が遅れました。",furi:"じこのために、でんしゃが おくれました",zh:"因為事故電車誤點。",tag:"ために原因",group:2,groupLabel:"条件・逆接・複合"},{id:29,jp:"日本語が上手になるように、毎日練習しています。",furi:"にほんごが じょうずに なるように、まいにち れんしゅうしています",zh:"為了日文變好每天練習。",tag:"ように",group:2,groupLabel:"条件・逆接・複合"},{id:30,jp:"忘れないように、メモしておきます。",furi:"わすれないように、メモしておきます",zh:"為了不忘記先做筆記。",tag:"ように",group:2,groupLabel:"条件・逆接・複合"},{id:31,jp:"先生によると、明日は休みだそうです。",furi:"せんせいによると、あしたは やすみだそうです",zh:"據老師說法明天放假。",tag:"によると",group:2,groupLabel:"条件・逆接・複合"},{id:32,jp:"天気によって、予定が変わります。",furi:"てんきによって、よていが かわります",zh:"根據天氣行程會變。",tag:"によって",group:2,groupLabel:"条件・逆接・複合"},{id:33,jp:"日本語について、質問があります。",furi:"にほんごについて、しつもんがあります",zh:"關於日文有問題。",tag:"について",group:2,groupLabel:"条件・逆接・複合"},{id:34,jp:"彼に対して、怒っています。",furi:"かれに たいして、おこっています",zh:"對他感到生氣。",tag:"に対して",group:2,groupLabel:"条件・逆接・複合"},{id:35,jp:"私にとって、日本語は難しいです。",furi:"わたしにとって、にほんごは むずかしいです",zh:"對我來說日文很難。",tag:"にとって",group:2,groupLabel:"条件・逆接・複合"},{id:36,jp:"もし時間があれば、手伝ってください。",furi:"もし じかんが あれば、てつだってください",zh:"如果有時間請幫忙。",tag:"もし〜ば",group:2,groupLabel:"条件・逆接・複合"},{id:37,jp:"行けば、分かります。",furi:"いけば、わかります",zh:"去了就懂了。",tag:"ば",group:2,groupLabel:"条件・逆接・複合"},{id:38,jp:"行ったら、電話してください。",furi:"いったら、でんわしてください",zh:"到了請打電話。",tag:"たら",group:2,groupLabel:"条件・逆接・複合"},{id:39,jp:"行くなら、早く行ってください。",furi:"いくなら、はやく いってください",zh:"如果要去請早點去。",tag:"なら",group:2,groupLabel:"条件・逆接・複合"},{id:40,jp:"行くと、すぐ分かります。",furi:"いくと、すぐ わかります",zh:"一去就馬上懂了。",tag:"と",group:2,groupLabel:"条件・逆接・複合"},{id:41,jp:"財布を盗まれました。",furi:"さいふを ぬすまれました",zh:"錢包被偷了。",tag:"受身被害",group:3,groupLabel:"N3動詞活用・受身使役・敬語"},{id:42,jp:"先生に褒められました。",furi:"せんせいに ほめられました",zh:"被老師稱讚了。",tag:"受身",group:3,groupLabel:"N3動詞活用・受身使役・敬語"},{id:43,jp:"子供に泣かれました。",furi:"こどもに なかれました",zh:"被小孩哭鬧搞得困擾。",tag:"迷惑受身",group:3,groupLabel:"N3動詞活用・受身使役・敬語"},{id:44,jp:"母に野菜を食べさせられました。",furi:"ははに やさいを たべさせられました",zh:"被媽媽強迫吃菜。",tag:"使役受身",group:3,groupLabel:"N3動詞活用・受身使役・敬語"},{id:45,jp:"社長に行かせていただきます。",furi:"しゃちょうに いかせて いただきます",zh:"請讓我去(謙讓)。",tag:"させていただく",group:3,groupLabel:"N3動詞活用・受身使役・敬語"},{id:46,jp:"日本語を勉強させてください。",furi:"にほんごを べんきょう させてください",zh:"請讓我學日文。",tag:"させてください",group:3,groupLabel:"N3動詞活用・受身使役・敬語"},{id:47,jp:"ちょっと待たせてください。",furi:"ちょっと またせてください",zh:"請讓我等一下。",tag:"させて",group:3,groupLabel:"N3動詞活用・受身使役・敬語"},{id:48,jp:"この本は読んでみてください。",furi:"この ほんは よんでみてください",zh:"請試著讀這本書。",tag:"てみて",group:3,groupLabel:"N3動詞活用・受身使役・敬語"},{id:49,jp:"ケーキを食べてしまいました。",furi:"ケーキを たべてしまいました",zh:"不小心把蛋糕吃完了。",tag:"てしまう後悔",group:3,groupLabel:"N3動詞活用・受身使役・敬語"},{id:50,jp:"窓が開けてあります。",furi:"まどが あけてあります",zh:"窗戶是開著的(有人開的)。",tag:"てある",group:3,groupLabel:"N3動詞活用・受身使役・敬語"},{id:51,jp:"窓が開いています。",furi:"まどが あいています",zh:"窗戶開著。",tag:"ている",group:3,groupLabel:"N3動詞活用・受身使役・敬語"},{id:52,jp:"この時計は父に買ってもらいました。",furi:"この とけいは ちちに かってもらいました",zh:"這錶是爸爸買給我的。",tag:"てもらう",group:3,groupLabel:"N3動詞活用・受身使役・敬語"},{id:53,jp:"友達に手伝ってくれました。",furi:"ともだちに てつだってくれました",zh:"朋友幫了我。",tag:"てくれる",group:3,groupLabel:"N3動詞活用・受身使役・敬語"},{id:54,jp:"私が教えてあげます。",furi:"わたしが おしえてあげます",zh:"我來教你吧。",tag:"てあげる",group:3,groupLabel:"N3動詞活用・受身使役・敬語"},{id:55,jp:"お待ちください。",furi:"おまちください",zh:"請稍等。",tag:"お〜ください敬語",group:3,groupLabel:"N3動詞活用・受身使役・敬語"},{id:56,jp:"お書きになった書類。",furi:"おかきになった しょるい",zh:"您寫的文件。",tag:"お〜になる尊敬",group:3,groupLabel:"N3動詞活用・受身使役・敬語"},{id:57,jp:"ご存知ですか。",furi:"ごぞんじですか",zh:"您知道嗎？",tag:"ご存知尊敬",group:3,groupLabel:"N3動詞活用・受身使役・敬語"},{id:58,jp:"参りました。",furi:"まいりました",zh:"我來了/去了(謙讓)。",tag:"参る",group:3,groupLabel:"N3動詞活用・受身使役・敬語"},{id:59,jp:"いただきます。",furi:"いただきます",zh:"我開動了(謙讓)。",tag:"いただく",group:3,groupLabel:"N3動詞活用・受身使役・敬語"},{id:60,jp:"致します。",furi:"いたします",zh:"我來做(謙讓)。",tag:"致す",group:3,groupLabel:"N3動詞活用・受身使役・敬語"},{id:61,jp:"彼は走って行ってしまいました。",furi:"かれは はしっていってしまいました",zh:"他跑走了。",tag:"ていってしまう",group:4,groupLabel:"N3終極衝刺 - 複合助詞・副詞・慣用"},{id:62,jp:"雨が降り始めた。",furi:"あめが ふりはじめた",zh:"開始下雨了。",tag:"始める",group:4,groupLabel:"N3終極衝刺 - 複合助詞・副詞・慣用"},{id:63,jp:"食べ終わったら、片付けてください。",furi:"たべおわったら、かたづけてください",zh:"吃完後請收拾。",tag:"終わる",group:4,groupLabel:"N3終極衝刺 - 複合助詞・副詞・慣用"},{id:64,jp:"彼は日本語が話せるようになりました。",furi:"かれは にほんごが はなせるように なりました",zh:"他變得會說日文了。",tag:"ようになる",group:4,groupLabel:"N3終極衝刺 - 複合助詞・副詞・慣用"},{id:65,jp:"日本語が話せるようにしています。",furi:"にほんごが はなせるようにしています",zh:"正在努力讓自己會說日文。",tag:"ようにする",group:4,groupLabel:"N3終極衝刺 - 複合助詞・副詞・慣用"},{id:66,jp:"勉強している間に、寝てしまいました。",furi:"べんきょうしている あいだに、ねてしまいました",zh:"在學習期間不小心睡著了。",tag:"間に",group:4,groupLabel:"N3終極衝刺 - 複合助詞・副詞・慣用"},{id:67,jp:"勉強しているうちに、日本語が好きになりました。",furi:"べんきょうしている うちに、にほんごが すきに なりました",zh:"在學習過程中喜歡上日文了。",tag:"うちに",group:4,groupLabel:"N3終極衝刺 - 複合助詞・副詞・慣用"},{id:68,jp:"暗くなる前に、帰りましょう。",furi:"くらくなる まえに、かえりましょう",zh:"在天黑前回去吧。",tag:"前に",group:4,groupLabel:"N3終極衝刺 - 複合助詞・副詞・慣用"},{id:69,jp:"暗くなってから、帰りました。",furi:"くらくなってから、かえりました",zh:"天黑後才回去。",tag:"から",group:4,groupLabel:"N3終極衝刺 - 複合助詞・副詞・慣用"},{id:70,jp:"この仕事は、私にはできません。",furi:"この しごとは、わたしには できません",zh:"這工作我做不到。",tag:"には",group:4,groupLabel:"N3終極衝刺 - 複合助詞・副詞・慣用"},{id:71,jp:"彼とは、もう会わないことにしました。",furi:"かれとは、もう あわないことに しました",zh:"決定不再跟他見面了。",tag:"ことにする",group:4,groupLabel:"N3終極衝刺 - 複合助詞・副詞・慣用"},{id:72,jp:"来月、転勤することになりました。",furi:"らいげつ、てんきんする ことに なりました",zh:"決定下個月要調職了。",tag:"ことになる",group:4,groupLabel:"N3終極衝刺 - 複合助詞・副詞・慣用"},{id:73,jp:"今、出かけるところです。",furi:"いま、でかけるところです",zh:"正要出門。",tag:"ところ",group:4,groupLabel:"N3終極衝刺 - 複合助詞・副詞・慣用"},{id:74,jp:"今、食べたところです。",furi:"いま、たべたところです",zh:"剛吃完。",tag:"たところ",group:4,groupLabel:"N3終極衝刺 - 複合助詞・副詞・慣用"},{id:75,jp:"今、食べているところです。",furi:"いま、たべているところです",zh:"正在吃。",tag:"ているところ",group:4,groupLabel:"N3終極衝刺 - 複合助詞・副詞・慣用"},{id:76,jp:"彼は、まるで日本人のように話します。",furi:"かれは、まるで にほんじんのように はなします",zh:"他講得簡直像日本人一樣。",tag:"まるで〜ように",group:4,groupLabel:"N3終極衝刺 - 複合助詞・副詞・慣用"},{id:77,jp:"あいつのせいで、遅れた。",furi:"あいつのせい
