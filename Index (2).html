<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JLPT - kong123485-beep/JLPT</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;background:#fbfbfa;color:#111}
header{padding:24px 20px;background:#fff;border-bottom:1px solid #ececf0;position:sticky;top:0;z-index:10}
.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 80px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:18px}
.card{background:#fff;border:1px solid #ececf0;border-radius:18px;padding:16px}
.meta{font-family:monospace;font-size:11px;color:#6b7280;word-break:break-all;margin-top:6px}
.open{display:block;margin-top:12px;background:#111;color:#fff;text-align:center;padding:10px;border-radius:12px;text-decoration:none;font-weight:700;font-size:13px}
.badge{display:inline-block;background:#111;color:#fff;font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;margin-bottom:6px}
</style>
</head>
<body>
<header>
<div style="max-width:1100px;margin:0 auto">
<h1>JLPT 溫習・日本語能力試驗</h1>
<div style="font-size:12px;color:#6b7280;margin-top:4px">JLPT N5-N3 溫習資源・自動追句・文法・單詞・購物會話 — github.com/kong123485-beep/JLPT</div>
</div>
</header>
<div class="wrap"><div class="grid" id="grid"></div></div>
<script>
async function load(){
  const res = await fetch('https://api.github.com/repos/kong123485-beep/JLPT/contents?ref=main');
  const data = await res.json();
  const files = data.filter(f=>f.type==='file' && f.name.endsWith('.html') && f.name.toLowerCase()!=='index.html').sort((a,b)=>a.name.localeCompare(b.name));
  const grid = document.getElementById('grid');
  files.forEach(f=>{
    const name = f.name;
    const card = document.createElement('div');
    card.className='card';
    card.innerHTML = `<span class="badge">JLPT</span><div style="font-weight:700;font-size:14px">${name}</div><div class="meta">https://kong123485-beep.github.io/JLPT/${name}</div><a class="open" href="https://kong123485-beep.github.io/JLPT/${encodeURI(name)}" target="_blank">開啟文件 →</a>`;
    grid.appendChild(card);
  });
}
load();
</script>
</body>
</html>
